<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Misha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
}

.card{
    width:100%;
    max-width:420px;
    padding:28px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    color:white;
}

h1{
    font-size:38px;
    margin-bottom:18px;
}
#typing{
    font-size:18px;
    line-height:1.8;
    min-height:190px;
    white-space:pre-line;
}

.question{

display:none;
margin-top:30px;

}

button{

width:100%;

padding:16px;

margin-top:15px;

font-size:17px;

font-weight:600;

border:none;

border-radius:40px;

transition:.3s;

cursor:pointer;

}

#yes{

background:white;
color:#ff4b7d;

}

#no{

background:#ff4b7d;
color:white;

}

.popup{

display:none;

position:fixed;

left:50%;

top:50%;

transform:translate(-50%,-50%);

width:90%;

max-width:360px;

padding:25px;

background:white;

color:#444;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

z-index:100;

animation:fade .5s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.heart{

position:fixed;

pointer-events:none;

color:white;

opacity:.5;

animation:float linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-120vh);

}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Hi Misha ❤️</h1>

<div id="typing"></div>

<div class="question" id="question">

<h2>Who do you think misses the other person more? 🥺</h2>

<button id="yes">🙈 You Miss Me More</button>
<button id="no">🥹 I Miss Misha More</button>

</div>

<div class="popup" id="popup"></div>

</div>

<script>

const text=`Myy GOO BOII ❤️

I just wanted to tell you something...

No matter how today feels,
I'll always have your back.

I'll always root for your happiness.

And one more thing...

I miss you.
Probably a lot more than you think. 🥺❤️`;

let i=0;

function type(){

    if(i<text.length){

        document.getElementById("typing").innerHTML+=text.charAt(i);

        i++;

        setTimeout(type,45);

    }else{

        document.getElementById("question").style.display="block";

    }

}

type();

const popup=document.getElementById("popup");

const yes=document.getElementById("yes");

const no=document.getElementById("no");

let hoverCount=0;

const funnyTexts=[
"😜 Nope!",
"😂 Too Slow!",
"🤭 Almost!",
"😏 Keep Trying!",
"🏃 Catch Me!",
"🤣 Still No!",
"🙈 Hehe!",
"❤️ Not Yet!",
"😆 One More!",
"🥺 Okay... Fine!"
];

yes.style.cursor="not-allowed";

yes.addEventListener("mouseover",()=>{

    if(hoverCount<10){

        yes.innerHTML=funnyTexts[hoverCount];

        yes.style.position="relative";

const maxX = window.innerWidth < 500 ? 70 : 130;
const maxY = window.innerWidth < 500 ? 35 : 60;

yes.style.left = (Math.random() * maxX * 2 - maxX) + "px";
yes.style.top = (Math.random() * maxY * 2 - maxY) + "px";

        hoverCount++;

    }
    else{

        yes.innerHTML="😇 You";

        yes.style.left="0px";

        yes.style.top="0px";

        yes.style.cursor="pointer";

    }

});

yes.onclick=function(){

    if(hoverCount<10){

        popup.style.display="block";

        popup.innerHTML=`

        <h2>😂 Heyyy!!</h2>

        <p>

        You have to catch the button first!

        <br><br>

        Current Progress:

        <b>${hoverCount}/10</b>

        </p>

        `;

        return;

    }

    popup.style.display="block";

    popup.innerHTML=`

    <h2>😂 You finally caught me!</h2>

    <p style="line-height:1.8">

    After making you chase me so many times...

    I think you've earned the truth.

    <br><br>

    ❤️ <b>I MISS YOU MORE.</b>

    🤗 Sending one huge hug.

    <br><br>

    😊 Mission Complete:

    <b>Can I get one smile from my Rasmalai?</b>

    </p>

    `;

}

no.onclick=function(){

    popup.style.display="block";

    popup.innerHTML=`

    <h2>🤣 I KNEW IT!</h2>

    <p style="line-height:1.8">

    You chose the correct answer, Proud of you.

    🏆

    <br><br>

    Thank you for accepting reality.

   <br><br>
    😊 You just made my day.
<b>Now give me a pyarii smile my gulab jamun,
Because that's my favourite thing in the whole world. ❤️</b>
    </p>

    `;

}

// Floating Hearts

setInterval(()=>{

    const h=document.createElement("div");

    h.className="heart";

    h.innerHTML="❤️";

    h.style.left=Math.random()*100+"vw";

    h.style.fontSize=(15+Math.random()*20)+"px";

    h.style.animationDuration=(6+Math.random()*6)+"s";

    document.body.appendChild(h);

    setTimeout(()=>{

        h.remove();

    },12000);

},300);

</script>
</body>

</html>
